<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administration — FSAC</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body>
<header class="site-header"><div class="brand-strip">
  <a class="brand-logo" href="../index.html"><img src="../assets/img/icoa.logo.png" alt="ICOA" onerror="this.parentElement.classList.add('logo-missing')"><span>ICOA</span></a>
  <a class="brand-logo" href="https://masterssb3rd.github.io/MasterSSB/" target="_blank" rel="noopener"><img src="../assets/img/ssb.logo.png" alt="SSB" onerror="this.parentElement.classList.add('logo-missing')"><span>SSB</span></a>
  <a class="brand-logo fsac-brand" href="../index.html"><img src="../assets/img/fsac.logo.jpg" alt="FSAC"></a>
  <a class="brand-logo" href="../index.html"><img src="../assets/img/sbq.logo.png" alt="SBQ" onerror="this.parentElement.classList.add('logo-missing')"><span>SBQ</span></a>
  <a class="brand-logo" href="../index.html"><img src="../assets/img/emgbr.logo.png" alt="EMGBR" onerror="this.parentElement.classList.add('logo-missing')"><span>EMGBR</span></a>
</div></header>
<main class="login-wrap">
  <form class="admin-card" id="login-form">
    <span class="section-kicker">ESPACE SÉCURISÉ</span><h2>Connexion administrateur</h2>
    <p class="muted">Connectez-vous pour gérer les conférences et les inscriptions.</p>
    <div class="field"><label for="username">Nom d'utilisateur</label><input id="username" name="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div id="login-error" class="login-error" hidden></div>
    <button type="submit" id="login-button" class="submit-button">Se connecter <span>→</span></button>
    <p style="margin:18px 0 0;font-size:.84rem"><a href="../index.html">← Retour au formulaire</a></p>
  </form>
</main>
<script src="../assets/js/config.js"></script><script src="../assets/js/api.js"></script><script src="../assets/js/admin-login.js"></script>
</body></html>
